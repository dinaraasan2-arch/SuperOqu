plugins { id 'com.android.application' }

android {
    namespace 'kz.superoqu.app'
    compileSdk 35
    defaultConfig {
        applicationId 'kz.superoqu.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.2.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
